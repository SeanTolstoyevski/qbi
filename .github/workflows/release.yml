name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Read and validate version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.version.outputs.base_version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v5

      - name: Read VERSION
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          # Release: 0.2.0   Beta: 0.2.0-beta (first beta) or 0.2.0-beta.2
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta(\.[0-9]+)?)?$ ]]; then
            echo "::error::VERSION must be a semantic version like 0.2.0, or a beta like 0.2.0-beta / 0.2.0-beta.1 (got: '$VERSION')"
            exit 1
          fi
          if [[ "$VERSION" == *-beta* ]]; then
            CHANNEL="beta"
          else
            CHANNEL="release"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Channel: $CHANNEL"

      - name: Enforce forward-only versioning
        run: |
          # GNU version sort only orders a prerelease before its stable release
          # when the "-" is mapped to "~": 0.2.0~beta < 0.2.0~beta.1 < 0.2.0.
          # That keeps beta < beta.1 < beta.2 < 0.2.0 < 0.2.1.
          sortkey() { sed -E 's/-([0-9A-Za-z.]+)$/~\1/'; }
          VERSION="${{ steps.version.outputs.version }}"
          TAGS="$(git ls-remote --tags origin)"
          LATEST_KEY="$(printf '%s\n' "$TAGS" \
            | sed -nE 's|.*refs/tags/v([0-9]+\.[0-9]+\.[0-9]+(-beta(\.[0-9]+)?)?)$|\1|p' \
            | sortkey \
            | sort -V | tail -n 1)"
          if [ -z "$LATEST_KEY" ]; then
            echo "Releasing v$VERSION (first tagged release)"
            exit 0
          fi
          CURRENT_KEY="$(printf '%s\n' "$VERSION" | sortkey)"
          LATEST="$(printf '%s' "$LATEST_KEY" | sed -E 's/~/-/')"
          if [ "$CURRENT_KEY" = "$LATEST_KEY" ]; then
            echo "::error::Version $VERSION is already released (tag v$LATEST exists). Bump VERSION to release again."
            exit 1
          fi
          if [ "$CURRENT_KEY" != "$(printf '%s\n' "$CURRENT_KEY" "$LATEST_KEY" | sort -V | tail -n 1)" ]; then
            echo "::error::VERSION ($VERSION) must be newer than the latest release (v$LATEST)."
            exit 1
          fi
          echo "Releasing v$VERSION (latest tag: v$LATEST)"

      - name: Template wails.json with the release version
        run: |
          jq --arg v "${{ steps.version.outputs.base_version }}" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      - name: Upload release context
        uses: actions/upload-artifact@v7
        with:
          name: release-context
          path: |
            wails.json
            VERSION
          retention-days: 1

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prepare
    steps:
      - uses: actions/checkout@v5

      - name: Install Wails Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI (pinned to the go.mod version)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Prepare frontend/dist for bindings
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: Generate Wails bindings
        run: wails generate module -tags "webkit2_41"

      - name: Install frontend dependencies
        run: npm ci --no-audit
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Build frontend bundle
        run: npm run build
        working-directory: frontend

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  test:
    name: Backend (vet + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prepare
    steps:
      - uses: actions/checkout@v5

      - name: Install Wails Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # main.go does //go:embed all:frontend/dist, so compiling the main
      # package only needs the directory to contain files. The real bundle
      # is built and tested by the frontend job; only the build jobs embed it.
      - name: Create placeholder frontend/dist for //go:embed
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: Vet
        run: go vet -tags webkit2_41 ./...

      - name: Test
        run: go test -tags webkit2_41 ./...

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [prepare, frontend, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            platform: linux/amd64
            tags: "-tags webkit2_41"
            binary: qbi
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
            tags: "-tags webkit2_41"
            binary: qbi
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            tags: ""
            binary: qbi.exe
          - name: windows-arm64
            os: windows-latest
            platform: windows/arm64
            tags: ""
            binary: qbi.exe
            cgo: "0"
          - name: darwin-amd64
            os: macos-15-intel
            platform: darwin/amd64
            tags: ""
            binary: qbi
          - name: darwin-arm64
            os: macos-latest
            platform: darwin/arm64
            tags: ""
            binary: qbi
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      LDFLAGS: -X qbi/internal/version.Version=${{ needs.prepare.outputs.version }} -X qbi/internal/version.Commit=${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Wails Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails CLI (pinned to the go.mod version)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Download release context (wails.json templated with the version)
        uses: actions/download-artifact@v8
        with:
          name: release-context
          path: release-context

      - name: Apply templated wails.json
        shell: bash
        run: cp release-context/wails.json wails.json

      - name: Download frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build application (wails)
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: wails build -s -m -skipbindings ${{ matrix.tags }} -platform "${{ matrix.platform }}" -ldflags "${{ env.LDFLAGS }} -X qbi/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify binary
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == darwin/* ]]; then
            test -x "build/bin/qbi.app/Contents/MacOS/qbi"
          else
            test -f "build/bin/${{ matrix.binary }}"
          fi

      - name: Stage build artifacts
        shell: pwsh
        run: |
          $base = "qbi-$env:VERSION-${{ matrix.name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          if ("${{ matrix.platform }}" -like "darwin/*") {
            Copy-Item -Recurse "build/bin/qbi.app" "dist/$base.app"
          } else {
            $exe = ""
            if ("${{ matrix.binary }}" -eq "qbi.exe") { $exe = ".exe" }
            Copy-Item "build/bin/${{ matrix.binary }}" "dist/$base$exe"
          }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload build assets
        uses: actions/upload-artifact@v7
        with:
          name: qbi-${{ env.VERSION }}-${{ matrix.name }}
          path: dist/
          retention-days: 1

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [prepare, build]
    steps:
      - uses: actions/checkout@v5

      - name: Download all build assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: qbi-*
          merge-multiple: true

      - name: Package release archives (zip)
        run: |
          cd dist
          for f in qbi-*; do
            [ -e "$f" ] || continue
            case "$f" in
              *.zip) continue ;;
              *.app) zip -r -q "${f%.app}.zip" "$f" && rm -rf "$f" ;;
              *)     zip -r -q "${f%.exe}.zip" "$f" && rm -f "$f" ;;
            esac
          done
          ls -la

      - name: Compute checksums for all assets
        run: |
          cd dist
          sha256sum qbi-*.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: QBI v${{ needs.prepare.outputs.version }}
          # Beta builds ship as pre-releases and never take over "latest".
          prerelease: ${{ needs.prepare.outputs.channel == 'beta' }}
          make_latest: ${{ needs.prepare.outputs.channel != 'beta' }}
          body: |
            QBI ${{ needs.prepare.outputs.version }}

            ${{ needs.prepare.outputs.channel == 'beta' && '> **Beta build** — not a stable release; features and behaviour may still change.' || '' }}

            SHA-256 checksums for all assets are in `checksums.txt`.
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
