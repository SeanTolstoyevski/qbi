name: Release

# Builds QBI for all supported platforms and publishes the assets to a GitHub
# Release whenever the "release" branch is updated (new commit, merge, ...).
# The workflow can also be triggered manually via the Actions UI.
#
# Versioning:
#   - The single source of truth is the VERSION file at the repository root
#     (a semantic version, e.g. "0.2.0").
#   - The version is injected into the Go binary at build time via
#     -ldflags (qbi/internal/version.Version / .Commit) and into the Windows
#     file metadata via wails.json info.productVersion.
#   - Releases only move forward: the workflow refuses to re-release an
#     existing tag or to release a version older than the latest tag
#     (QBI does not maintain old versions / backward releases).
#   - Each platform is built on its native runner (Wails uses CGO and needs
#     the platform's own toolchain/SDK; Go-only cross-compilation is not
#     enough). darwin/amd64 runs on the macos-15-intel runner; darwin/arm64 runs on macos-latest.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Read and validate version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          VERSION="$(cat VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must contain a semantic version like 0.2.0 (got: '$VERSION')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Enforce forward-only versioning
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          LATEST="$(git ls-remote --tags origin | grep -E 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' | sed -E 's|.*refs/tags/v||' | sort -V | tail -n 1)"
          if [ -n "$LATEST" ] && [ "$LATEST" = "$VERSION" ]; then
            echo "::error::Version $VERSION is already released (tag v$VERSION exists). Bump VERSION to release again."
            exit 1
          fi
          if [ -n "$LATEST" ] && [ "$VERSION" != "$(printf '%s\n' "$LATEST" "$VERSION" | sort -V | tail -n 1)" ]; then
            echo "::error::VERSION ($VERSION) must be newer than the latest release (v$LATEST)."
            exit 1
          fi
          echo "Releasing v$VERSION (latest tag: ${LATEST:-none})"

      - name: Template wails.json with the release version
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      - name: Upload release context
        uses: actions/upload-artifact@v4
        with:
          name: release-context
          path: |
            wails.json
            VERSION
          retention-days: 1

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: prepare
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend bundle
        run: npm run build

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  test:
    name: Backend (vet + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Wails Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Vet
        run: go vet -tags webkit2_41 ./...

      - name: Test
        run: go test -tags webkit2_41 ./...

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [prepare, frontend, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            platform: linux/amd64
            tags: "-tags webkit2_41"
            binary: qbi
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            tags: ""
            binary: qbi.exe
          - name: darwin-amd64
            os: macos-15-intel
            platform: darwin/amd64
            tags: ""
            binary: qbi
          - name: darwin-arm64
            os: macos-latest
            platform: darwin/arm64
            tags: ""
            binary: qbi
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # Injected into the Go binary via Wails' -ldflags passthrough.
      LDFLAGS: -X qbi/internal/version.Version=${{ needs.prepare.outputs.version }} -X qbi/internal/version.Commit=${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Wails Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Wails CLI (pinned to the go.mod version)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Download release context (wails.json templated with the version)
        uses: actions/download-artifact@v4
        with:
          name: release-context
          path: release-context

      - name: Apply templated wails.json
        shell: bash
        run: cp release-context/wails.json wails.json

      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build application (wails)
        run: wails build -s ${{ matrix.tags }} -platform "${{ matrix.platform }}" -ldflags "${{ env.LDFLAGS }}"

      - name: Verify binary
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == darwin/* ]]; then
            test -x "build/bin/qbi.app/Contents/MacOS/qbi"
          else
            test -f "build/bin/${{ matrix.binary }}"
          fi

      # Stage the raw build output only. The zips are created later in the
      # release job: uploading an already-zipped archive here would make the
      # artifact download a zip containing another zip, and raw files next to
      # the zips would end up as release assets as well.
      - name: Stage build artifacts
        shell: pwsh
        run: |
          $base = "qbi-$env:VERSION-${{ matrix.name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          if ("${{ matrix.platform }}" -like "darwin/*") {
            Copy-Item -Recurse "build/bin/qbi.app" "dist/$base.app"
          } else {
            $exe = ""
            if ("${{ matrix.binary }}" -eq "qbi.exe") { $exe = ".exe" }
            Copy-Item "build/bin/${{ matrix.binary }}" "dist/$base$exe"
          }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload build assets
        uses: actions/upload-artifact@v4
        with:
          name: qbi-${{ env.VERSION }}-${{ matrix.name }}
          path: dist/
          retention-days: 1

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [prepare, build]
    steps:
      - uses: actions/checkout@v4

      - name: Download all build assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: qbi-*
          merge-multiple: true

      - name: Package release archives (zip)
        run: |
          cd dist
          for f in qbi-*; do
            [ -e "$f" ] || continue
            case "$f" in
              *.zip) continue ;;
              *.app) zip -r -q "${f%.app}.zip" "$f" && rm -rf "$f" ;;
              *)     zip -r -q "${f%.exe}.zip" "$f" && rm -f "$f" ;;
            esac
          done
          ls -la

      - name: Compute checksums for all assets
        run: |
          cd dist
          sha256sum qbi-*.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: QBI v${{ needs.prepare.outputs.version }}
          body: |
            QBI ${{ needs.prepare.outputs.version }}

            Supported platforms:
            - Windows (amd64)
            - macOS (Apple Silicon, arm64)
            - macOS (Intel, amd64)
            - Linux (amd64)

            SHA-256 checksums for all assets are in `checksums.txt`.
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
