# Test resources for the local Docker Desktop Kubernetes cluster.
# Apply with: kubectl apply -f test/local-cluster.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: qbi-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: qbi-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: qbi-test
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: qbi-test
data:
  greeting: "Hello from qbi test"
  environment: "local"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: qbi-test
type: Opaque
stringData:
  apiKey: "super-secret-value"
  dbPassword: "local-only-password"
